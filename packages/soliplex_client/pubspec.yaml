name: soliplex_client
description: Pure Dart client for Soliplex backend HTTP and AG-UI APIs
version: 1.0.0-dev
publish_to: none
resolution: workspace

environment:
  sdk: ^3.6.0

dependencies:
  # AG-UI protocol 1.0 (soliplex/frontend#694). Back to a hosted version once
  # the SDK is published.
  ag_ui:
    git:
      url: https://github.com/soliplex/ag-ui.git
      ref: d073f900ee49c4f340ed943b4ba48abe33d292dd
      path: sdks/community/dart
  collection: ^1.19.1
  http: ^1.2.0
  meta: ^1.9.0
  signals_core: ^6.3.1
  soliplex_logging:
    path: ../soliplex_logging

dev_dependencies:
  fake_async: ^1.3.1
  mocktail: ^1.0.0
  test: ^1.24.0
  very_good_analysis: ^10.0.0
