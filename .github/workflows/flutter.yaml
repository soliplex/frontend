name: Flutter CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".markdownlint.json"
      - "LICENSE"
  pull_request:
    branches: [main, 'feat/**', 'fix/**', 'refactor/**', 'chore/**']
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".markdownlint.json"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  SLACK_NOTIFY_URL: ${{ secrets.SLACK_NOTIFY_URL }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup Dart environment
        uses: ./.github/actions/setup-dart-env

      - name: Check formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze code
        run: flutter analyze --fatal-infos

      - name: Check documentation
        run: dart doc --dry-run

      - name: Lint markdown
        run: npx markdownlint-cli2 "**/*.md" "#node_modules"

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup Dart environment
        uses: ./.github/actions/setup-dart-env

      - name: Generate random seed
        id: seed
        run: echo "value=$RANDOM" >> "$GITHUB_OUTPUT"

      - name: Run app tests
        run: |
          SEED="${{ steps.seed.outputs.value }}"
          echo "::notice::Test ordering seed: $SEED"
          flutter test --test-randomize-ordering-seed="$SEED" --coverage

      - name: Run package tests
        run: |
          # Each package's report lands in coverage/<pkg>.lcov.info with
          # repo-relative paths, beside the app's coverage/lcov.info.
          # Exclude integration-tagged tests (require a live backend).
          # --coverage-package pins the report to the package's own lib/;
          # in the workspace it otherwise also counts the sibling packages
          # it imports.
          for pkg in soliplex_agent soliplex_client soliplex_logging; do
            echo "::group::Testing $pkg"
            (cd "packages/$pkg" && dart test --exclude-tags integration \
              --coverage-path=coverage/lcov.info --coverage-package="^$pkg\$")
            sed "s|^SF:$PWD/|SF:|" "packages/$pkg/coverage/lcov.info" \
              > "coverage/$pkg.lcov.info"
            echo "::endgroup::"
          done
          # soliplex_design runs the full suite incl. goldens. Goldens
          # render per-platform; the committed baseline is a Linux baseline,
          # so this Linux job compares rather than skips. Refresh it with
          # the update-goldens workflow.
          for pkg in soliplex_client_native soliplex_design; do
            echo "::group::Testing $pkg"
            (cd "packages/$pkg" && flutter test --coverage)
            sed "s|^SF:lib/|SF:packages/$pkg/lib/|" \
              "packages/$pkg/coverage/lcov.info" > "coverage/$pkg.lcov.info"
            echo "::endgroup::"
          done

      - name: Report seed on failure
        if: failure()
        run: |
          SEED="${{ steps.seed.outputs.value }}"
          echo "::error::Tests failed with ordering seed: $SEED"
          echo "Reproduce with: --test-randomize-ordering-seed=$SEED"

      - name: Upload golden diffs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: golden-failures
          path: packages/soliplex_design/test/components/**/failures/
          if-no-files-found: ignore
          retention-days: 7

      - name: Check coverage thresholds
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lcov
          # Mockups are prototypes (see docs/mockups.md); their smoke tests
          # load them without exercising them. Packages are gated below on
          # their own reports.
          lcov --remove coverage/lcov.info 'packages/*' 'lib/src/mockups/*' \
            -o coverage/lcov.info --ignore-errors unused
          # Package minimums are the 2026-10 baselines rounded down to a
          # multiple of 5. Raise them as coverage grows; never lower them
          # to land a change.
          STATUS=0
          scripts/coverage_gate.sh app coverage/lcov.info 80 || STATUS=1
          while read -r pkg min; do
            scripts/coverage_gate.sh "$pkg" "coverage/$pkg.lcov.info" "$min" \
              || STATUS=1
          done <<'EOF'
          soliplex_agent 85
          soliplex_client 90
          soliplex_client_native 85
          soliplex_design 90
          soliplex_logging 90
          EOF
          exit "$STATUS"

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      - name: Notify Slack on failure
        if: failure() && env.SLACK_NOTIFY_URL != ''
        uses: slackapi/slack-github-action@v4.0.0
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          REF: ${{ github.ref }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          webhook: ${{ env.SLACK_NOTIFY_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "channel": "#soliplex",
              "username": "flutter-ci",
              "text": ":x: Tests failed on ${{ env.REF }}:\n${{ env.COMMIT_MSG }}\n${{ env.RUN_URL }}",
              "icon_emoji": ":flutter:"
            }

  build-web:
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup Dart environment
        uses: ./.github/actions/setup-dart-env

      - name: Build web
        run: flutter build web --release

      - name: Upload web artifact
        uses: actions/upload-artifact@v7
        with:
          name: web-build
          path: build/web/
          retention-days: 7

      - name: Notify Slack on failure
        if: failure() && env.SLACK_NOTIFY_URL != ''
        uses: slackapi/slack-github-action@v4.0.0
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          REF: ${{ github.ref }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          webhook: ${{ env.SLACK_NOTIFY_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "channel": "#soliplex",
              "username": "flutter-ci",
              "text": ":x: Web build failed on ${{ env.REF }}:\n${{ env.COMMIT_MSG }}\n${{ env.RUN_URL }}",
              "icon_emoji": ":flutter:"
            }
